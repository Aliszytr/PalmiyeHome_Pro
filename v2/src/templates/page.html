<!doctype html>
<html lang="{{v lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{v page_title}} — Palmiye Home</title>
<meta name="description" content="{{v page_description}}">
{{v robots}}
<link rel="canonical" href="{{v canonical}}">
{{v hreflang}}
<meta name="theme-color" content="#f8f5ef">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicon-180.png">
<link rel="stylesheet" href="{{v css}}">
{{v gtag}}
</head>
<body>
{{v sprite}}
<a class="skip" href="#main">{{t a11y.skip}}</a>
{{v consent}}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{v home_url}}">Palmiye Home</a>
    {{v lang_switch}}
  </div>
</header>
<main id="main" class="wrap page">
{{v body}}
</main>
{{v footer}}
<script type="application/json" id="site-data">{{v runtime}}</script>
<script src="{{v js_track}}" defer></script>
</body>
</html>
